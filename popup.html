<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi màu nền</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #ffffff;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
      text-align: center;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    #colorPicker {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
      background: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #colorHex {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      background-color: #f3f4f6;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 4px;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #059669;
      display: none;
    }

    .status.show {
      display: block;
    }
  </style>
</head>
<body>
  <h1>🎨 Đổi màu nền</h1>
  <div class="color-picker-wrapper">
    <input type="color" id="colorPicker" value="#3b82f6">
    <span id="colorHex">#3b82f6</span>
  </div>
  <button id="applyBtn">Áp dụng ngay</button>
  <button id="resetBtn" style="background-color: #6b7280; margin-top: 8px;">Reset về trắng</button>
  <div id="status" class="status">Đã áp dụng!</div>

  <script src="popup.js"></script>
</body>
</html>
